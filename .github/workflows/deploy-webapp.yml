name: Deploy webapp to GitHub Pages

# Builds webapp/ and publishes it as a GitHub Pages *project* site at
# https://anandbagmar.github.io/MockedE2EDemo/ — a separate repo/deployment
# that does not touch the anandbagmar.github.io user site.

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'e2eTests/**'
      - '.github/workflows/deploy-webapp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci

      - name: Build webapp
        working-directory: webapp
        run: npm run build

      # Serve the built webapp and run the Selenium web tests against it.
      # If the tests fail this step fails, the artifact is never uploaded, and
      # the deploy job (needs: build) is skipped — so we only deploy on green.
      - name: Run web tests against the built webapp
        run: |
          set -e
          nohup npm --prefix webapp run preview -- --port 5173 --strictPort --host 127.0.0.1 \
            > /tmp/webapp-preview.log 2>&1 &
          echo "Waiting for webapp on http://127.0.0.1:5173 ..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then echo "webapp is up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null \
            || { echo "webapp failed to start"; cat /tmp/webapp-preview.log; exit 1; }
          ./e2eTests/gradlew -p e2eTests runWeb \
            -Dheadless=true -DWEB_BASE_URL=http://127.0.0.1:5173 --no-daemon

      - name: Upload web test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: e2eTests/build/reports/tests/runWeb
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
